spring.application.name=vetvision

server.port=${PORT:${SERVER_PORT:8083}}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-2d7301d3-anurag-c0f3.k.aivencloud.com:17086/Vetvision?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:local-development-only-change-this-secret-key}
jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://127.0.0.1:5173}

# Bootstrap organization
app.bootstrap.organization.email=
app.bootstrap.organization.password=
app.bootstrap.organization.first-name=Organization
app.bootstrap.organization.last-name=Admin

# JSON and logging
spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.org.springframework.security=INFO